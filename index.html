<!DOCTYPE html>
<html>
    <head>
        <title> Student Record Managment </title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<style>
    header{
    background-image: url(https://tse4.mm.bing.net/th/id/OIP.NOvUyQ928JV9s679oaH_DQHaJQ?r=0&rs=1&pid=ImgDetMain&o=7&rm=3);
    background-repeat: no-repeat;
    background-size: cover;
    height: 200px;
}
</style>
    </head>
    <body>
<header class=" p-3 d-flex justify-content-center align-items-center">
    <h1 class="text-light"> Student Record Managment </h1>
</header>

<div class="container my-5">
    <div class="row">

<!-- add Student -->
    <div class="col-md-6">
    <div class=" card p-4 shadow">
        <h2> Add Student</h2>
        <form id="studentform">
            <div class="mb-3">
                <label> student name </label>
                <input type="text" id="name" class=" form-control" required>
            </div>

             <div class="mb-3">
                <label> student age </label>
                <input type="number" id="age" class=" form-control" required>
            </div>

             <div class="mb-3">
                <label> student type </label>
                <select id="type" class=" form-control" required>
                    <option value="regular"> regular</option>
                    <option value="honors"> honors</option>
                </select>
            </div>
            <button class="btn btn-info" type="submit"> add student </button>
        </form>
    </div>
    </div>


<!-- student list -->

<div class="col-md-6">
    <div class=" card p-4 shadow">
        <h2>  Student list</h2>
        <table class=" table table-bordered">
<thead>
    <tr>
        <th> name</th>
        <th> age</th>
        <th> type</th>
        <th> action</th>
    </tr>
</thead>
<tbody  id="studenttable"></tbody>
        </table>
    </div>
    </div>

    </div>
</div>
<script>
    let regularStudents=[];
    let honorStudent=[];

    function displayStudents(){
        let table = document.getElementById("studenttable");
        table.innerHTML="";

    // regularStudents
    for (let i=0;i<regularStudents.length; i++){
        table.innerHTML +=`
<tr>
<td>${regularStudents[i].name}</td>
<td>${regularStudents[i].age}</td>
<td> regular</td>
<td><button class="btn btn-danger" onclick="deletestudent('regular', ${i})"> delete</button></td>
</tr>
        `;
    }

    // honorStudents
     for (let i=0;i<honorStudent.length; i++){
        table.innerHTML +=`
<tr>
<td>${honorStudent[i].name}</td>
<td>${honorStudent[i].age}</td>
<td> honor</td>
<td><button class="btn btn-danger" onclick="deletestudent('honors', ${i})"> delete</button></td>
</tr>
        `;
    }
    }

    // Form Submit
    document.getElementById("studentform").addEventListener("submit", function(event) {
event.preventDefault();

let name= document.getElementById("name").value;
let age= document.getElementById("age").value;
let type= document.getElementById("type").value;

let student={
    name:name, age:age
}

if(type==="regular"){
    regularStudents.push(student);
}
else{
    honorStudent.push(student);
}

this.reset();
displayStudents()
    });
    

<!-- deletefunction -->
function deletestudent(type,index){
    if (type==="regular"){
        regularStudents.splice(index,1);
    }else{
        honorStudent.splice(index,1);
    }
    displayStudents()
}
</script>
    </body>
</html>
